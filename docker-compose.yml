version: "3.9"

# FastStrm-Go Docker Compose
# 纯 Go 架构：单二进制运行，前端 SPA 通过 embed.FS 嵌入
services:
  faststrm:
    build:
      context: .
      dockerfile: Dockerfile
    image: wabisabi926/faststrm:latest
    container_name: faststrm
    ports:
      - "8090:8090"
      # Emby 反代端口：默认 8097，对应 UI 里 "Emby 反向代理 → 反代监听端口"
      # 容器侧（冒号右边）必须与 UI 的 proxyPort 一致，改了要同步这里（例如 "8098:8098"）；
      # 宿主机侧（冒号左边）被占用时可换，例如 "18097:8097"，客户端用宿主机端口访问
      - "8097:8097"
    environment:
      - TZ=Asia/Shanghai
      - APP_ENV=prod
      - DATA_DIR=/app/data
      - CONFIG_DIR=/app/config
      - DEFAULT_CONFIG_DIR=/app/.config
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8090
    volumes:
      - ./strmData:/app/data
      - ./config:/app/config
    restart: unless-stopped
    # 服务退出时最多等待 20s 排空运行中任务；Docker 默认 10s 会提前 SIGKILL。
    stop_grace_period: 25s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
