version: "3.9"

# FastStrm-Go Docker Compose
# 纯 Go 架构：单二进制运行，前端 SPA 通过 embed.FS 嵌入
services:
  faststrm:
    build:
      context: .
      dockerfile: Dockerfile
    image: wabisabi926/faststrm:latest
    container_name: faststrm
    ports:
      - "8090:8090"
      # Emby 反代端口：默认 8097，对应 UI 里 "Emby 反向代理 → 反代监听端口"
      # 改了 ProxyPort 记得同步修改下面这个值（例如改成 8098:8098）
      - "8097:8097"
    environment:
      - TZ=Asia/Shanghai
      - APP_ENV=prod
      - DATA_DIR=/app/data
      - CONFIG_DIR=/app/config
      - DEFAULT_CONFIG_DIR=/app/.config
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8090
    volumes:
      - ./strmData:/app/data
      - ./config:/app/config
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
