version: "3.9"

# FastStrm-Go Docker Compose (开发/测试用)
# 纯 Go 架构：单二进制运行，前端 SPA 通过 embed.FS 嵌入
# 与 docker-compose.yml 的区别：memory 限制更宽松，便于开发调试
services:
  faststrm:
    build:
      context: .
      dockerfile: Dockerfile
    image: wabisabi926/faststrm:go-latest
    container_name: faststrm-go
    ports:
      - "8090:8090"
    environment:
      - TZ=Asia/Shanghai
      - APP_ENV=prod
      - DATA_DIR=/app/data
      - CONFIG_DIR=/app/config
      - DEFAULT_CONFIG_DIR=/app/.config
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8090
    volumes:
      - ./strmData:/app/data
      - ./config:/app/config
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 128M
