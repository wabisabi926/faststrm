# golangci-lint 配置
# 宽松起步，避免现有代码大量 lint error 阻止 CI 运行。
# 后续逐个打开更多 linter。

run:
  timeout: 5m
  go: '1.25'
  skip-dirs:
    - frontend/node_modules
    - internal/web/spa   # SPA embed 产物
    - dist
    - vendor

linters:
  disable-all: true
  enable:
    # ---- 必开：编译器级别检查 ----
    - typecheck
    - goimports          # import 排序
    - gosimple           # 简化代码
    - govet              # 官方 vet（最稳）
    - ineffassign        # 无效赋值
    - unused             # 未使用变量/常量
    - misspell           # 拼写错误
    - staticcheck        # 静态分析（必开）
    - reassign           # := 误用 = 可能的 bug
    - unconvert          # 没必要的类型转换

    # ---- go-zero 生态友好 ----
    - errcheck           # error 未检查（go-zero 项目普遍有这个）
    - gosec              # 安全检查（但关了 G101-G104 硬编码）

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: false   # 允许 _ = err
    exclude-functions:
      - (*http.Response).Body.Close
      - (*sql.Rows).Close
      - (*sql.Row).Scan
      - os.Remove
      - os.RemoveAll
      - os.Close
      - file.Close
      - http.Flusher.Flush
      - (*bufio.Writer).Flush
      - (*os.File).Sync

  gosec:
    excludes:
      - G101  # hardcoded credentials（有些 secret 是占位符，自动改太烦）
      - G102  # insecure http（内网服务）
      - G103  # weak TLS min version
      - G104  # hardcoded password
      - G107  # potential http request without timeout
      - G115  # assert is called (redundant type assertion)
    config:
      G107:
        # 允许无超时的外部调用（有 context 的不算）
        httpcheck_ssl: true

  goimports:
    local-prefixes: github.com/wabisabi926/faststrm

  staticcheck:
    checks: ["all", "-SA9003", "-SA1019"]
    # SA9003: empty branch (允许空 if）
    # SA1019: deprecated（go-zero 有一些 deprecated handler 不影响）

issues:
  exclude-rules:
    # 测试文件宽松
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        - gosec.G101
        - staticcheck

    # handler 层允许直接 panic（go-zero 风格）
    - path: internal/handler/
      linters:
        - errcheck
        - gosec

    # main.go 入口文件
    - path: cmd/server/main\.go
      linters:
        - errcheck

  max-issues-per-linter: 0   # 不限制数量，全部显示
  max-same-issues: 0         # 不限制同类数量
  new-from-rev: ''           # 允许对所有代码而非仅改动检查

  # 允许 TODO/FIXME
  exclude-use-default: false
