# golangci-lint v2 配置 — 极简起步
# v2 schema 与 v1 完全不同：disable-all 移到 linters-settings，exclude-rules/exclude-dirs 移到 issues.exclude
# 参考：https://golangci-lint.run/docs/configuration/

version: "2"

run:
  timeout: 5m

linters:
  enable:
    - govet
    - misspell

linters-settings:
  disable-all: true

formatters:
  enable:
    - goimports

formatters-settings:
  goimports:
    local-prefixes: github.com/wabisabi926/faststrm

issues:
  exclude:
    - path: _test\.go
      linters: [errcheck, gosec, staticcheck]
    - path: (frontend/node_modules|internal/web/spa|dist|vendor)/
