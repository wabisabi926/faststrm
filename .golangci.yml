# golangci-lint v1 配置（配合 CI go install 源码编译的 lint v1.64.x+）
# 起步策略：只开零争议的 linter，确保 CI 不卡
# 后续迭代逐个打开：ineffassign → unused → staticcheck → errcheck → gosec
# 注意：typecheck 是 golangci-lint 内置机制（v1.57+），不是可单独 enable 的 linter

run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - goimports
    - govet
    - misspell

linters-settings:
  goimports:
    local-prefixes: github.com/wabisabi926/faststrm

issues:
  exclude-dirs:
    - frontend/node_modules
    - internal/web/spa
    - dist
    - vendor
  max-issues-per-linter: 0
  max-same-issues: 0
