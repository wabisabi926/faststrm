# golangci-lint v2 配置
# 起步策略：只开格式 + 基础 vet，确保 CI 零失败启动。
# 后续逐个打开：ineffassign → unused → staticcheck → errcheck → gosec。

version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - goimports

linters:
  disable-all: true
  enable:
    - govet          # 官方 go vet
    - misspell       # 拼写错误

formatters-settings:
  goimports:
    local-prefixes: github.com/wabisabi926/faststrm

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        - staticcheck

  exclude-dirs:
    - frontend/node_modules
    - internal/web/spa
    - dist
    - vendor

  max-issues-per-linter: 0
  max-same-issues: 0
  new-from-rev: ''
  exclude-use-default: false
