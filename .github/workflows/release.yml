name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ github.repository }}
  FNPACK_URL: https://static2.fnnas.com/fnpack/fnpack-1.2.1-linux-amd64

jobs:
  # ---- Job 0: 提取更新日志作为 Release Notes ----
  release-notes:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Extract release notes
      id: notes
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        TAG="${GITHUB_REF_NAME}"
        NOTES_CONTENT=""

        # 优先从 .changes 目录读取版本日志
        if [ -f ".changes/${TAG}.md" ]; then
          echo "Found .changes/${TAG}.md"
          NOTES_CONTENT=$(cat ".changes/${TAG}.md")
        elif [ -f ".changes/${VERSION}.md" ]; then
          echo "Found .changes/${VERSION}.md"
          NOTES_CONTENT=$(cat ".changes/${VERSION}.md")
        # 其次从 docs/CHANGELOG.md 提取对应版本
        elif [ -f "docs/CHANGELOG.md" ]; then
          echo "Extracting v${VERSION} section from docs/CHANGELOG.md"
          NOTES_CONTENT=$(awk "/^## v${VERSION}[[:space:]]/{found=1; next} /^## v/{if(found) exit} found" docs/CHANGELOG.md)
        fi

        if [ -n "$NOTES_CONTENT" ]; then
          echo "Using custom release notes."
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES_CONTENT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
        else
          echo "No custom release notes found, will use auto-generated notes."
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "Release ${TAG}" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "### 更新日志" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "请编辑 \`.changes/${TAG}.md\` 添加自定义更新日志。" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
        fi

    - name: Save release notes to file
      run: |
        echo "${{ steps.notes.outputs.body }}" > release_notes.md
        cat release_notes.md

    - name: Upload release notes artifact
      uses: actions/upload-artifact@v7
      with:
        name: release-notes
        path: release_notes.md

  # ---- Job 1: Docker 镜像构建 + 推送到 Docker Hub ----
  docker-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 20

    - name: Update version from tag
      id: version
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        echo "Tag: ${{ github.ref_name }} -> Version: $VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        if [ -f frontend/package.json ]; then
          cd frontend
          node -e "const fs=require('fs'); const p='./package.json'; const pkg=JSON.parse(fs.readFileSync(p,'utf8')); pkg.version='$VERSION'; fs.writeFileSync(p, JSON.stringify(pkg,null,2)+'\n');"
          echo "Updated package.json version to $VERSION"
          node -e "console.log('current version:', require('./package.json').version)"
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern=v{{version}}
          type=raw,value=${{ github.ref_name }}
          type=raw,value=latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          VERSION=${{ github.ref_name }}
          BUILD_DATE=${{ github.event.head_commit.timestamp }}
          GOPROXY=https://proxy.golang.org,direct

  # ---- Job 2: 飞牛 fNOS .fpk 包 (amd64 + arm64) ----
  fnos-build:
    needs: release-notes
    runs-on: ubuntu-latest

    steps:
    - name: Get current time
      id: time
      run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Node.js (构建前端 SPA 嵌入 Go embed)
      uses: actions/setup-node@v5
      with:
        node-version: 20

    - name: Build frontend SPA (Vite) 并嵌入 Go embed
      env:
        NODE_OPTIONS: --max-old-space-size=4096
      run: |
        set -euo pipefail
        VERSION_CLEAN="${GITHUB_REF_NAME#v}"
        cd frontend
        npm ci
        node -e "const fs=require('fs'); const p='./package.json'; const pkg=JSON.parse(fs.readFileSync(p,'utf8')); pkg.version='$VERSION_CLEAN'; fs.writeFileSync(p, JSON.stringify(pkg,null,2)+'\n');"
        npm run build
        echo "frontend build ok, internal/web/spa contents:"
        ls -la ../internal/web/spa/

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'
        cache: true

    - name: Install fnpack (飞牛官方打包工具)
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.local/bin"
        curl -fSL --retry 3 "${{ env.FNPACK_URL }}" -o "$HOME/.local/bin/fnpack"
        chmod +x "$HOME/.local/bin/fnpack"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        fnpack --version || fnpack help || true

    - name: Verify Go & fnpack
      run: |
        echo "go version: $(go version)"
        echo "fnpack path: $(command -v fnpack || true)"

    - name: Build fNOS .fpk (all arches)
      env:
        GOPROXY: https://proxy.golang.org,direct
        APP_VERSION: ${{ github.ref_name }}
        PUBLISH_DATE: ${{ steps.time.outputs.date }}
      run: |
        set -euo pipefail
        chmod +x ./scripts/build-fnos.sh
        ./scripts/build-fnos.sh all

    - name: List dist artifacts
      run: ls -lh dist/

    - name: Upload .fpk packages as artifact
      uses: actions/upload-artifact@v7
      with:
        name: fnos-packages
        path: dist/*.fpk

  # ---- Job 3: 原生独立二进制 (Windows amd64 + Linux amd64 / arm64) ----
  native-build:
    needs: release-notes
    runs-on: ubuntu-latest

    steps:
    - name: Get current time
      id: time
      run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Node.js (构建前端 SPA 嵌入到 Go embed)
      uses: actions/setup-node@v5
      with:
        node-version: 20

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'
        cache: true

    - name: Build frontend SPA (Vite) 并嵌入 Go embed
      env:
        NODE_OPTIONS: --max-old-space-size=4096
      run: |
        set -euo pipefail
        VERSION_CLEAN="${GITHUB_REF_NAME#v}"
        cd frontend
        npm ci
        node -e "const fs=require('fs'); const p='./package.json'; const pkg=JSON.parse(fs.readFileSync(p,'utf8')); pkg.version='$VERSION_CLEAN'; fs.writeFileSync(p, JSON.stringify(pkg,null,2)+'\n');"
        npm run build
        echo "frontend build ok, internal/web/spa contents:"
        ls -la ../internal/web/spa/

    - name: Build Windows amd64 (zip with SPA + 默认 config)
      env:
        GOPROXY: https://proxy.golang.org,direct
        APP_VERSION: ${{ github.ref_name }}
        PUBLISH_DATE: ${{ steps.time.outputs.date }}
      run: |
        set -euo pipefail
        go mod download
        
        # 安装 rsrc 工具用于嵌入 Windows 图标
        go install github.com/akavel/rsrc@latest
        
        # 生成 Windows 图标资源文件（仅在 Windows 构建时使用，之后立即删除）
        if [ -f "cmd/server/favicon.ico" ]; then
          echo "Generating icon resource from favicon.ico..."
          rsrc -ico="cmd/server/favicon.ico" -o="cmd/server/rsrc.syso" -arch=amd64
          echo "Icon resource generated successfully."
        else
          echo "Warning: favicon.ico not found, skipping icon embedding."
        fi
        
        OUT_DIR="faststrm_windows_amd64"
        mkdir -p "$OUT_DIR"
        CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
          go build -trimpath \
            -ldflags="-H=windowsgui -s -w \
              -X 'main.version=${APP_VERSION}' \
              -X 'main.BuildDate=${PUBLISH_DATE}' \
              -X 'github.com/wabisabi926/faststrm/internal/handler.appVersion=${APP_VERSION}' \
              -X 'github.com/wabisabi926/faststrm/internal/web.appVersion=${APP_VERSION}'" \
            -o "${OUT_DIR}/faststrm.exe" ./cmd/server/
        
        # 关键：删除 rsrc.syso，避免后续 Linux 构建时产生 ARM64 重定位错误
        rm -f cmd/server/rsrc.syso
        echo "Cleaned up rsrc.syso for cross-platform builds"
        
        cp -r internal/web "${OUT_DIR}/web" 2>/dev/null || true
        (cd "${OUT_DIR}" && zip -q -r "../${OUT_DIR}.zip" .)
        ls -lh "${OUT_DIR}.zip"

    - name: Build Linux amd64
      env:
        GOPROXY: https://proxy.golang.org,direct
        APP_VERSION: ${{ github.ref_name }}
        PUBLISH_DATE: ${{ steps.time.outputs.date }}
      run: |
        set -euo pipefail
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -trimpath \
            -ldflags="-s -w \
              -X 'main.version=${APP_VERSION}' \
              -X 'main.BuildDate=${PUBLISH_DATE}' \
              -X 'github.com/wabisabi926/faststrm/internal/handler.appVersion=${APP_VERSION}' \
              -X 'github.com/wabisabi926/faststrm/internal/web.appVersion=${APP_VERSION}'" \
            -o "faststrm_linux_amd64" ./cmd/server/
        ls -lh faststrm_linux_amd64

    - name: Build Linux arm64
      env:
        GOPROXY: https://proxy.golang.org,direct
        APP_VERSION: ${{ github.ref_name }}
        PUBLISH_DATE: ${{ steps.time.outputs.date }}
      run: |
        set -euo pipefail
        CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
          go build -trimpath \
            -ldflags="-s -w \
              -X 'main.version=${APP_VERSION}' \
              -X 'main.BuildDate=${PUBLISH_DATE}' \
              -X 'github.com/wabisabi926/faststrm/internal/handler.appVersion=${APP_VERSION}' \
              -X 'github.com/wabisabi926/faststrm/internal/web.appVersion=${APP_VERSION}'" \
            -o "faststrm_linux_arm64" ./cmd/server/
        ls -lh faststrm_linux_arm64

    - name: List native artifacts
      run: ls -lh faststrm_windows_amd64.zip faststrm_linux_amd64 faststrm_linux_arm64

    - name: Upload native binaries as artifact
      uses: actions/upload-artifact@v7
      with:
        name: native-binaries
        path: |
          faststrm_windows_amd64.zip
          faststrm_linux_amd64
          faststrm_linux_arm64

  # ---- Job 4: 统一创建 Release 并上传所有产物 ----
  github-release:
    needs: [release-notes, docker-release, fnos-build, native-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download release-notes artifact
      uses: actions/download-artifact@v8
      with:
        name: release-notes
        path: artifacts/release-notes

    - name: Download fnos-packages artifact
      uses: actions/download-artifact@v8
      with:
        name: fnos-packages
        path: artifacts/fnos-packages

    - name: Download native-binaries artifact
      uses: actions/download-artifact@v8
      with:
        name: native-binaries
        path: artifacts/native-binaries

    - name: List all downloaded artifacts
      run: find artifacts -type f -ls

    - name: Create GitHub Release with notes and upload all assets
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        TAG="${{ github.ref_name }}"
        RELEASE_NOTES=""
        
        # 读取 release notes
        if [ -f "artifacts/release-notes/release_notes.md" ]; then
          RELEASE_NOTES=$(cat artifacts/release-notes/release_notes.md)
        fi

        # 创建 Release 并上传所有产物
        echo "Creating release $TAG with notes and all assets..."
        
        # 收集所有需要上传的文件
        ASSETS=()
        
        # fpk 文件
        for f in artifacts/fnos-packages/*.fpk; do
          [ -f "$f" ] && ASSETS+=("$f")
        done
        
        # 原生二进制
        for f in artifacts/native-binaries/faststrm_*; do
          [ -f "$f" ] && ASSETS+=("$f")
        done
        
        echo "Assets to upload:"
        for a in "${ASSETS[@]}"; do
          echo "  $a"
        done

        # 创建或更新 Release
        if [ -n "$RELEASE_NOTES" ]; then
          echo "Using custom release notes."
          gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Release $TAG" \
              --notes "$RELEASE_NOTES"
          # 更新 notes（如果 Release 已存在）
          gh release edit "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --notes "$RELEASE_NOTES" 2>/dev/null || true
        else
          echo "Using auto-generated release notes."
          gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Release $TAG" \
              --generate-notes
        fi

        # 上传所有产物
        for ASSET in "${ASSETS[@]}"; do
          echo "Uploading $ASSET ..."
          gh release upload "$TAG" "$ASSET" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
        done

        echo "Release $TAG completed successfully!"
        gh release view "$TAG" --repo "${GITHUB_REPOSITORY}"
