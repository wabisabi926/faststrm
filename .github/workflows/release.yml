name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ github.repository }}
  FNPACK_URL: https://static2.fnnas.com/fnpack/fnpack-1.2.1-linux-amd64

jobs:
  # ---- Job 1: Docker 镜像构建 + 推送到 Docker Hub ----
  docker-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Update version from tag
      id: version
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        echo "Tag: ${{ github.ref_name }} -> Version: $VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        if [ -f frontend/package.json ]; then
          cd frontend
          node -e "const fs=require('fs'); const p='./package.json'; const pkg=JSON.parse(fs.readFileSync(p,'utf8')); pkg.version='$VERSION'; fs.writeFileSync(p, JSON.stringify(pkg,null,2)+'\n');"
          echo "Updated package.json version to $VERSION"
          node -e "console.log('current version:', require('./package.json').version)"
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern=v{{version}}
          type=raw,value=latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          VERSION=${{ github.ref_name }}
          BUILD_DATE=${{ github.event.head_commit.timestamp }}
          GOPROXY=https://proxy.golang.org,direct

  # ---- Job 2: 飞牛 fNOS .fpk 包 (amd64 + arm64) ----
  fnos-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 写 Release Assets

    steps:
    - name: Get current time
      id: time
      run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

    - name: Checkout repository
      uses: actions/checkout@v4

    # ---- 对齐 qmediasync：fnos-release 自己构建 SPA + 前端嵌入到 Go binary
    #      (不依赖 native-release job 的产物，两个 job 并行独立可跑)
    - name: Set up Node.js (构建前端 SPA 嵌入 Go embed)
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Build frontend SPA (Vite) 并嵌入 Go embed
      env:
        NODE_OPTIONS: --max-old-space-size=4096
      run: |
        set -euo pipefail
        VERSION_CLEAN="${GITHUB_REF_NAME#v}"
        cd frontend
        npm ci
        node -e "const fs=require('fs'); const p='./package.json'; const pkg=JSON.parse(fs.readFileSync(p,'utf8')); pkg.version='$VERSION_CLEAN'; fs.writeFileSync(p, JSON.stringify(pkg,null,2)+'\n');"
        npm run build
        echo "frontend build ok, internal/web/spa contents:"
        ls -la ../internal/web/spa/

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache: true

    - name: Install fnpack (飞牛官方打包工具)
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.local/bin"
        curl -fSL --retry 3 "${{ env.FNPACK_URL }}" -o "$HOME/.local/bin/fnpack"
        chmod +x "$HOME/.local/bin/fnpack"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        fnpack --version || fnpack help || true  # 仅打印版本信息，不同版本 subcommand 可能有差异

    - name: Verify Go & fnpack
      run: |
        echo "go version: $(go version)"
        echo "fnpack path: $(command -v fnpack || true)"

    - name: Build fNOS .fpk (all arches)
      env:
        GOPROXY: https://proxy.golang.org,direct
        APP_VERSION: ${{ github.ref_name }}
        PUBLISH_DATE: ${{ steps.time.outputs.date }}
      run: |
        set -euo pipefail
        chmod +x ./scripts/build-fnos.sh
        ./scripts/build-fnos.sh all

    - name: List dist artifacts
      run: ls -lh dist/

    - name: Upload .fpk to GitHub Release Assets
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        TAG="${{ github.ref_name }}"
        # 安装/更新 GitHub CLI (runner 自带的 gh 已经足够新)
        gh --version
        # 先确保 Release 已经创建 (如果 docker-release job 还没创建好就会失败，gh release create --clobber 不支持)
        # 这里用 create-if-not-exists 的惯用手法：create 失败时忽略，然后上传
        gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
          gh release create "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Release $TAG" \
            --generate-notes

        # 上传所有 .fpk 和 VERSION 目录打包成 zip
        cd dist
        for FPK in ./*.fpk; do
          [ -f "$FPK" ] || continue
          echo "Uploading $FPK ..."
          gh release upload "$TAG" "$FPK" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
        done

        # 同时把解压后的安装目录也打成 zip 方便用户下载
        for DIR in ./faststrm-*/; do
          [ -d "$DIR" ] || continue
          BASENAME="$(basename "$DIR")"
          ZIP="${BASENAME}.zip"
          (cd "$DIR" && zip -q -r "../${ZIP}" .)
          echo "Uploading $ZIP ..."
          gh release upload "$TAG" "$ZIP" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
        done

  # ---- Job 2.5: 原生独立二进制 (Windows amd64 + Linux amd64 / arm64) ----
  # 对齐 qmediasync 的一次性打包模式：tag 一推，全平台二进制自动出现在 Release Assets
  native-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Get current time
      id: time
      run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js (构建前端 SPA 嵌入到 Go embed)
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache: true

    - name: Build frontend SPA (Vite) 并嵌入 Go embed
      env:
        NODE_OPTIONS: --max-old-space-size=4096
      run: |
        set -euo pipefail
        VERSION_CLEAN="${GITHUB_REF_NAME#v}"
        cd frontend
        npm ci
        node -e "const fs=require('fs'); const p='./package.json'; const pkg=JSON.parse(fs.readFileSync(p,'utf8')); pkg.version='$VERSION_CLEAN'; fs.writeFileSync(p, JSON.stringify(pkg,null,2)+'\n');"
        npm run build
        echo "frontend build ok, internal/web/spa 内容："
        ls -la ../internal/web/spa/

    - name: Build Windows amd64 (zip with SPA + 默认 config)
      env:
        GOPROXY: https://proxy.golang.org,direct
        APP_VERSION: ${{ github.ref_name }}
        PUBLISH_DATE: ${{ steps.time.outputs.date }}
      run: |
        set -euo pipefail
        go mod download
        OUT_DIR="faststrm_windows_amd64"
        mkdir -p "$OUT_DIR"
        CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
          go build -trimpath \
            -ldflags="-H=windowsgui -s -w \
              -X 'main.version=${APP_VERSION}' \
              -X 'main.BuildDate=${PUBLISH_DATE}' \
              -X 'github.com/wabisabi926/faststrm/internal/handler.appVersion=${APP_VERSION}' \
              -X 'github.com/wabisabi926/faststrm/internal/web.appVersion=${APP_VERSION}'" \
            -o "${OUT_DIR}/faststrm.exe" ./cmd/server/
        # 打包：二进制 + 一份示例 config
        cp -r internal/web "${OUT_DIR}/web" 2>/dev/null || true
        (cd "${OUT_DIR}" && zip -q -r "../${OUT_DIR}.zip" .)
        ls -lh "${OUT_DIR}.zip"

    - name: Build Linux amd64
      env:
        GOPROXY: https://proxy.golang.org,direct
        APP_VERSION: ${{ github.ref_name }}
        PUBLISH_DATE: ${{ steps.time.outputs.date }}
      run: |
        set -euo pipefail
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -trimpath \
            -ldflags="-s -w \
              -X 'main.version=${APP_VERSION}' \
              -X 'main.BuildDate=${PUBLISH_DATE}' \
              -X 'github.com/wabisabi926/faststrm/internal/handler.appVersion=${APP_VERSION}' \
              -X 'github.com/wabisabi926/faststrm/internal/web.appVersion=${APP_VERSION}'" \
            -o "faststrm_linux_amd64" ./cmd/server/
        ls -lh "faststrm_linux_amd64"

    - name: Build Linux arm64
      env:
        GOPROXY: https://proxy.golang.org,direct
        APP_VERSION: ${{ github.ref_name }}
        PUBLISH_DATE: ${{ steps.time.outputs.date }}
      run: |
        set -euo pipefail
        CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
          go build -trimpath \
            -ldflags="-s -w \
              -X 'main.version=${APP_VERSION}' \
              -X 'main.BuildDate=${PUBLISH_DATE}' \
              -X 'github.com/wabisabi926/faststrm/internal/handler.appVersion=${APP_VERSION}' \
              -X 'github.com/wabisabi926/faststrm/internal/web.appVersion=${APP_VERSION}'" \
            -o "faststrm_linux_arm64" ./cmd/server/
        ls -lh "faststrm_linux_arm64"

    - name: List native artifacts
      run: ls -lh faststrm_windows_amd64.zip faststrm_linux_amd64 faststrm_linux_arm64

    - name: Upload native binaries to GitHub Release Assets
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        TAG="${{ github.ref_name }}"
        gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
          gh release create "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Release $TAG" \
            --generate-notes
        for ART in faststrm_windows_amd64.zip faststrm_linux_amd64 faststrm_linux_arm64; do
          [ -f "$ART" ] || continue
          echo "Uploading $ART ..."
          gh release upload "$TAG" "$ART" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
        done

  # ---- Job 3: 创建 Release (兜底, 在 docker-release / fnos-release / native-release 之后) ----
  # Docker Hub 镜像 + fNOS .fpk + Win/Linux 原生二进制 全部上传完成后, 保证 Release 存在且包含 release notes
  github-release:
    needs: [docker-release, fnos-release, native-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Create / update GitHub Release (notes only)
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
        append_body: false
