name: Sync Wiki

on:
  push:
    branches: [go]
    paths:
      - "wiki_drafts/**"
      - "scripts/sync-wiki.mjs"
      - "scripts/sync-wiki.ps1"
  workflow_dispatch:

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    permissions:
      # Note: GITHUB_TOKEN does not support a separate 'wiki' scope.
      # contents:write is the closest fit; if push to *.wiki.git still fails,
      # configure a repo-scoped PAT as secret GH_WIKI_PAT and reference it below.
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Sync wiki_drafts/*.md to GitHub Wiki (Git mode)
      env:
        # If wiki push fails with default GITHUB_TOKEN, create a PAT with
        # 'repo' scope and store it in the repo secrets as GH_WIKI_PAT,
        # then change the line below to: ${{ secrets.GH_WIKI_PAT }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GIT_USER_NAME: "github-actions[bot]"
        GIT_USER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
      run: |
        node scripts/sync-wiki.mjs
