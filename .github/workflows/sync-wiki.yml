name: Sync Wiki

on:
  push:
    branches: [main]
    paths:
      - "wiki_drafts/**"
      - "scripts/sync-wiki.mjs"
  workflow_dispatch:

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Sync wiki_drafts to GitHub Wiki
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        node scripts/sync-wiki.mjs
