name: CI

on:
  push:
    branches: [go, master, main]
    paths-ignore:
      - 'docs/**'
      - 'wiki_drafts/**'
      - '.changes/**'
      - '*.md'
      - 'FNOS/**'
      - 'scripts/**'
  pull_request:
    branches: [go, master, main]
    paths-ignore:
      - 'docs/**'
      - 'wiki_drafts/**'
      - '.changes/**'
      - '*.md'
      - 'FNOS/**'
      - 'scripts/**'

jobs:
  # ---- Job 1: Go 单元测试 + 覆盖率 ----
  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'
        cache: true

    - name: Verify Go version
      run: go version

    - name: Download Go modules
      run: go mod download
      env:
        GOPROXY: https://proxy.golang.org,direct

    - name: Run Go tests with coverage
      run: |
        # 排除 SPA embed 产物、node_modules 里的 Go 代码（vendor）、本地调试工具（tools/）
        # tools/check_db 等为一次性调试脚本，依赖硬编码本地路径，无法在 CI 中运行
        PKGS=$(go list ./... | grep -v '/tools/')
        COVERPKGS=$(echo "$PKGS" | paste -sd, -)
        go test $PKGS -count=1 -coverprofile=coverage.out \
          -coverpkg="$COVERPKGS" \
          2>&1 | tee test_output.txt
        EXIT=${PIPESTATUS[0]}

        # 打印覆盖率概要（排除无测试文件的包和 vendor）
        echo ""
        echo "=== Coverage Summary ==="
        go tool cover -func=coverage.out \
          | grep -E '^github.com/wabisabi926/faststrm/' \
          | grep -v 'frontend/node_modules' \
          | tail -1

        # 失败退出
        if [ $EXIT -ne 0 ]; then
          echo "❌ Go tests failed"
          exit $EXIT
        fi
        echo "✅ All Go tests passed"
      env:
        GOPROXY: https://proxy.golang.org,direct

    - name: Upload coverage artifact
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: go-coverage
        path: coverage.out
        if-no-files-found: warn
        retention-days: 7

    - name: Upload test output on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: go-test-output
        path: test_output.txt
        if-no-files-found: ignore
        retention-days: 7

  # ---- Job 2: golangci-lint 代码规范检查 ----
  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'
        cache: true

    - name: Install golangci-lint (goinstall 用本地 Go 1.25 编译，避开 release 是 go1.24 构建的版本不匹配)
      run: |
        go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      env:
        GOPROXY: https://proxy.golang.org,direct

    - name: Run golangci-lint
      run: |
        golangci-lint run --timeout=5m --config .golangci.yml ./...
      env:
        GOPROXY: https://proxy.golang.org,direct

  # ---- Job 3: 前端 Vitest 单元测试 ----
  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci
      env:
        NODE_OPTIONS: --max-old-space-size=4096

    - name: Run Vitest
      run: npx vitest run --reporter=verbose
      env:
        NODE_OPTIONS: --max-old-space-size=4096

    - name: Verify frontend build
      run: npm run build
      env:
        NODE_OPTIONS: --max-old-space-size=4096

  # ---- Job 4: Go build 全平台编译验证 ----
  go-build:
    name: Go Build (Cross-platform)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64}
          - {os: linux, arch: arm64}
          - {os: windows, arch: amd64}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'
        cache: true

    - name: Build frontend SPA first (needed for embed)
      run: |
        cd frontend
        npm ci
        npm run build
      env:
        GOPROXY: https://proxy.golang.org,direct
        NODE_OPTIONS: --max-old-space-size=4096

    - name: Build ${{ matrix.os }}/${{ matrix.arch }}
      run: |
        CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
          go build -trimpath \
            -o "faststrm-${{ matrix.os }}-${{ matrix.arch }}" \
            ./cmd/server/
        echo "✅ Build ${{ matrix.os }}/${{ matrix.arch }} succeeded"
      env:
        GOPROXY: https://proxy.golang.org,direct

    - name: Upload build artifact
      uses: actions/upload-artifact@v7
      with:
        name: build-${{ matrix.os }}-${{ matrix.arch }}
        path: faststrm-${{ matrix.os }}-${{ matrix.arch }}*
        if-no-files-found: ignore
        retention-days: 3
